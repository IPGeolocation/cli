name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ["1.26.10"]
        include:
          - os: ubuntu-24.04
            go: "1.27.3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
      - run: go mod verify
      - run: go test -race -v ./...
      - run: go vet ./...
      - name: Check the executable
        run: |
          go run ./cmd/ipgeolocation --version
          go run ./cmd/ipgeolocation --help
      - name: Scan source dependencies
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'Linux'
        with:
          node-version: "24.22.1"
      - run: npm install --global postman-cli@1.73.0
        if: runner.os == 'Linux'
      - run: node scripts/test-http.cjs
        if: runner.os == 'Linux'
        timeout-minutes: 3
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: bash build-release.sh
      - name: Check the Linux archive
        run: |
          mkdir "$RUNNER_TEMP/cli"
          tar -xzf dist/*-linux-amd64.tar.gz -C "$RUNNER_TEMP/cli"
          "$RUNNER_TEMP"/cli/* --version
          "$RUNNER_TEMP"/cli/* --help
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-archives
          path: dist/*
          if-no-files-found: error
          retention-days: 7
